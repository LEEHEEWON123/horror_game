name: WebGL Build and Netlify Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: webgl-netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: HorrorEscapeGame/Library
          key: Library-WebGL-${{ hashFiles('HorrorEscapeGame/Assets/**', 'HorrorEscapeGame/Packages/**', 'HorrorEscapeGame/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build WebGL (Unity)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 6000.4.10f1
          targetPlatform: WebGL
          projectPath: HorrorEscapeGame
          buildMethod: WebGLBuild.BuildForNetlify
          allowDirtyBuild: true

      - name: Verify WebGL build output
        run: |
          test -f HorrorEscapeGame/Builds/WebGL/index.html
          test -f HorrorEscapeGame/Builds/WebGL/Build/WebGL.data.br
          du -sh HorrorEscapeGame/Builds/WebGL

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: HorrorEscapeGame/Builds/WebGL
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy ${{ github.sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 15
